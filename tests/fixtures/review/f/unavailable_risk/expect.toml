kind = "clean"
status = "failed"
reason_codes = ["provider_failure", "review_failed"]

# The risk call is optional, but in evals/models.toml it shares the `review` binding:
# three failures in a row bench that binding (the breaker, MODEL_ROUTING §7), so the
# plan call is refused and the review fails honestly instead of going on without it.
[[silence]]
path = "src/lib.rs"
why = "the fault benches the binding, so nothing may be published"

[fault]
kind = "unavailable"
role = "risk-classifier"
at_call = 1
