# Dependency policy, enforced by `cargo deny check` on every Cargo.lock change.
# Copyleft is denied even though the core is AGPL, so the Apache-2.0 integrations
# and a commercial licence stay possible. Exceptions need a maintainer's approval
# and a reason next to them.

[graph]
# Only the targets Gitcko ships. rustls-platform-verifier pulls a CDLA-licensed root store
# only on targets outside this list, which we never build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
# The allow-list is policy, so licences no dependency uses yet are expected.
unused-allowed-license = "allow"
# Our own published crates are AGPL-3.0-or-later on purpose (LICENSE_STRATEGY §2); the
# copyleft ban above is for third-party dependencies. gitcko-protocol is Apache-2.0 and
# needs no entry. Added per phase at once (Phase 1, then Phase 2) so parallel crate PRs don't
# edit this file.
exceptions = [
    { crate = "gitcko-cassette", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-config", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-diff", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-domain", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-git", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-graph", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-index", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-model", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-model-ollama", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-model-openai", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-prompts", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-redact", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-search", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-syntax", allow = ["AGPL-3.0-or-later"] },
    { crate = "gitcko-tools", allow = ["AGPL-3.0-or-later"] },
]

[licenses.private]
# Unpublished workspace crates (xtask) are ours, not dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates have no version; that is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
