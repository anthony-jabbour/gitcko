[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gitcko-cassette = { path = "../crates/gitcko-cassette" }
gitcko-git = { path = "../crates/gitcko-git" }
gitcko-model = { path = "../crates/gitcko-model" }
gitcko-model-openai = { path = "../crates/gitcko-model-openai" }
gitcko-protocol.workspace = true
gitcko-redact = { path = "../crates/gitcko-redact" }
gitcko-review = { path = "../crates/gitcko-review" }
gitcko-test-support = { path = "../crates/gitcko-test-support" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# test-util for the paused clock fault cases run under, so a backoff or deadline costs no time.
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
toml.workspace = true

[dev-dependencies]
gitcko-model = { path = "../crates/gitcko-model", features = ["fake"] }

[lints]
workspace = true
