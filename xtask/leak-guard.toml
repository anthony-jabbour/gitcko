# Leak guard for the public repo: a gitleaks config (https://github.com/gitleaks/gitleaks).
# It keeps gitleaks' default secret rules and adds rules for things that must never
# land here: names, paths and settings of the private hosted service, and private
# planning docs. Run with `cargo xtask leak-guard`; `--self-test` proves it blocks them.
#
# The patterns below are written so this file doesn't match its own rules.

title = "gitcko public-repo leak guard"

[extend]
useDefault = true

[[rules]]
id = "private-repo-name"
description = "Name or env-var prefix of the private hosted-service repo"
regex = '''(?i)gitcko[-_]cloud'''

[[rules]]
id = "hosted-service-env-var"
description = "Environment variable of a hosted-service provider"
regex = '''\b(STRIPE|E2B|RAILWAY)_[A-Z0-9_]+\b'''

[[rules]]
id = "hosted-service-path"
description = "Folder that only exists in the private hosted-service repo"
path = '''^(services|apps/web-cloud|apps/site|infra|migrations/cloud|vendor)/'''

[[rules]]
id = "planning-doc"
description = "Private planning doc; public docs are written fresh under other names"
path = '''(^|/)research/|^docs/(Gitcko_PRD|MVP|ROADMAP|ARCHITECTURE|CLOUD_ARCHITECTURE|DATABASE|REVIEW_ENGINE|REVIEW_RULES|INDEXING|SECURITY|THREAT_MODEL|PRIVACY|INCIDENT_RESPONSE|MODEL_ROUTING|EVALS|SCORING|TESTING|DEVELOPMENT|AI_DEVELOPMENT|CODEBASE|CONFIGURATION|CONTRIBUTING|LICENSE_STRATEGY|LOCAL_DEPLOYMENT|SELF_HOSTING|RUNTIME_VERIFICATION|SCM_INTEGRATION|MCP_SPEC|CLI_SPEC|API_SPEC|TUI_SPEC|DASHBOARD|ANALYTICS|OBSERVABILITY|BRANDING|design)\.md$'''

[[rules]]
id = "personal-agent-rules"
description = "Personal agent rules file; it is git-ignored and must stay local"
path = '''(^|/)CLAUDE\.local\.md$'''
