# PR gate. Fork PRs run here too, so: read-only token, no secrets, actions pinned
# by commit, and nothing from the PR is interpolated into a shell command.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per branch, so a new push cancels the stale run. Each push to
  # main gets its own group and is never cancelled or replaced, because its
  # leak-guard scan covers only that push's commits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.149
  DENY_VERSION: 0.20.2
  INSTA_VERSION: 1.49.0
  FUZZ_VERSION: 0.13.2
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Which path-filtered checks (TESTING §4) this change needs. Jobs that depend on it
  # are skipped, not failed, when their files didn't change.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      schema: ${{ steps.filter.outputs.schema }}
      canaries: ${{ steps.filter.outputs.canaries }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            schema:
              - 'crates/gitcko-protocol/**'
              - 'integrations/schemas/**'
              - 'xtask/**'
              - 'Cargo.lock'
            canaries:
              - 'crates/**'
              - 'xtask/**'
            fuzz:
              - 'crates/gitcko-diff/**'
              - 'crates/gitcko-config/**'
              - 'crates/gitcko-domain/**'
              - 'fuzz/**'
              - 'xtask/src/fuzz.rs'

  # fmt, clippy and tests on every OS we ship (rustup installs the toolchain
  # pinned in rust-toolchain.toml on first use).
  check:
    name: check (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo xtask check
      # Redaction canaries (TESTING §4) on every OS whenever crate code changes; they
      # also run inside `check`, but this fails loudly if none are found.
      - name: Redaction canaries
        if: needs.changes.outputs.canaries == 'true'
        run: cargo xtask canaries
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The committed JSON Schemas must match the gitcko-protocol types.
  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask schema-check

  # Fuzz targets still build when a parser they cover changes (TESTING §4). Linux only:
  # libFuzzer on Windows is unreliable, and runs happen in fuzz-nightly.yml.
  fuzz-build:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly pinned in fuzz/rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@${{ env.FUZZ_VERSION }}
      - run: cargo xtask fuzz --build

  # Repo policy: leak guard, licence headers, crate layers, dependency licences.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the leak guard scans the PR's commits
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@${{ env.DENY_VERSION }},cargo-insta@${{ env.INSTA_VERSION }}
      - name: Install gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Leak guard self-test
        run: cargo xtask leak-guard --self-test
      - name: Leak guard
        env:
          # Commits in the PR, or the commits a push to main added.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # If BASE is unknown here (first push, or a force push whose old tip isn't
        # fetched), scan all history instead of an empty range.
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            cargo xtask leak-guard --range "${BASE}..${HEAD}"
          else
            cargo xtask leak-guard --range "${HEAD}"
          fi
      # The test job already fails on a changed snapshot on every OS; this also fails on
      # a snapshot file no test uses any more.
      - name: Snapshots (none pending or unreferenced)
        run: cargo insta test --check --unreferenced=reject
      # A squash merge lands the whole PR as one new commit, which the step above never
      # saw: patterns spanning several commits only appear together there (it let a
      # false positive reach main in #11). Scan the PR squashed onto its base too.
      - name: Leak guard (the PR squashed, as it will land)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Put back the commit actions/checkout chose (the PR merged into its base), so
        # the policy steps after this one check the tree that will land.
        run: |
          checked_out=$(git rev-parse HEAD)
          git checkout -q --detach "${BASE}"
          git merge --squash -q "${HEAD}"
          git -c user.name=ci -c user.email=ci@ci.invalid commit -q --allow-empty -m squashed
          cargo xtask leak-guard --range "${BASE}..HEAD"
          git checkout -q --detach "${checked_out}"
      - name: Licence headers
        run: cargo xtask spdx
      - name: Crate layers
        run: cargo xtask layers
      - name: Dependency licences, bans and sources
        run: cargo deny check licenses bans sources
      - name: Security advisories (when Cargo.lock changes)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Only on lockfile changes, so a newly published advisory doesn't block unrelated PRs;
        # the dependency it names gets fixed in its own PR.
        run: |
          # Three dots: only what this PR changed, not what main changed since.
          # If git can't diff (unknown BASE), check advisories to be safe. The diff
          # is captured first so grep exiting early can't turn a match into a skip.
          changed=$(git diff --name-only "${BASE}...${HEAD}") || changed=Cargo.lock
          if grep -qx 'Cargo.lock' <<<"${changed}"; then
            cargo deny check advisories
          else
            echo "Cargo.lock unchanged; advisories not checked in this PR"
          fi
