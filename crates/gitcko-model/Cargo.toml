[package]
name = "gitcko-model"
version = "0.0.0"
description = "The model layer's core: roles, bindings, where calls go, budgets, call records and the provider trait every adapter implements"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A scripted provider for tests in this and downstream crates.
fake = []
# The checks every adapter's tests/conformance.rs runs (`cargo xtask conformance`).
conformance = []

[dependencies]
futures-util.workspace = true
gitcko-config = { path = "../gitcko-config", version = "0.0.0" }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
gitcko-model = { path = ".", features = ["fake"] }
gitcko-redact = { path = "../gitcko-redact" }
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

[lints]
workspace = true
