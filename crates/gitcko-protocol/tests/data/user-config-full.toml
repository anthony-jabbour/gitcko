# Every user key from CONFIGURATION §6 and §7.
color = true
telemetry = false
api_url = "https://api.gitcko.dev"
web_url = "https://app.gitcko.dev"

[review]
output = "auto"
layout = "comments"
context = 15
width = 100

[models.bindings.smart]
provider = "openrouter"
model = "example/model-1"
reasoning_effort = "medium"
family = "anthropic"
data_policy = "zdr"

[models.bindings.fast]
provider = "ollama"
model = "example-coder:7b"
endpoint = "http://127.0.0.1:11434"
context = 32768

[models.roles]
judge = "smart"
review-light = "fast"

[models.fallbacks]
fast = ["fast", "smart"]

[models.inversion]
enabled = true
