[package]
name = "gitcko-storage"
version = "0.0.0"
description = "Local filesystem review history: JSON results, a running marker, and cross-run lifecycle"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gitcko-domain = { path = "../gitcko-domain", version = "0.0.0" }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
gitcko-redact = { path = "../gitcko-redact" }
gitcko-test-support = { path = "../gitcko-test-support" }
proptest.workspace = true

[lints]
workspace = true
