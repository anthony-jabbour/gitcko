[package]
name = "gitcko-cli"
version = "0.0.0"
description = "The gitcko binary: review a repository and print what was stored"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gitcko"
path = "src/main.rs"

[dependencies]
# Parser derive: https://docs.rs/clap/4.6.7/clap/_features/index.html
clap = { workspace = true }
gitcko-config = { path = "../gitcko-config", version = "0.0.0" }
# `v1` (the default) selects the OS store: macOS Keychain, Windows Credential Manager,
# Linux Secret Service. https://docs.rs/keyring/4.2.0/keyring/
keyring = { workspace = true }
gitcko-domain = { path = "../gitcko-domain", version = "0.0.0" }
gitcko-git = { path = "../gitcko-git", version = "0.0.0" }
gitcko-index = { path = "../gitcko-index", version = "0.0.0" }
gitcko-model = { path = "../gitcko-model", version = "0.0.0" }
gitcko-model-ollama = { path = "../gitcko-model-ollama", version = "0.0.0" }
gitcko-model-openai = { path = "../gitcko-model-openai", version = "0.0.0" }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
gitcko-render = { path = "../gitcko-render", version = "0.0.0" }
gitcko-review = { path = "../gitcko-review", version = "0.0.0" }
gitcko-storage = { path = "../gitcko-storage", version = "0.0.0" }
gitcko-tui = { path = "../gitcko-tui", version = "0.0.0" }
# Pure-Rust gzip. The default feature links a C zlib.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
minisign-verify.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
toml.workspace = true
# Deflate via flate2's Rust backend, so the Windows zip has no C zlib either.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `rt-multi-thread` is the runtime the CLI owns; `signal` is Ctrl-C.
# https://docs.rs/tokio/1.54.1/tokio/#feature-flags
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "net", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
gitcko-config = { path = "../gitcko-config", version = "0.0.0" }
gitcko-model = { path = "../gitcko-model", version = "0.0.0" }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
gitcko-redact = { path = "../gitcko-redact", version = "0.0.0" }
gitcko-review = { path = "../gitcko-review", version = "0.0.0" }
gitcko-storage = { path = "../gitcko-storage", version = "0.0.0" }
gitcko-test-support = { path = "../gitcko-test-support", version = "0.0.0" }
# Default features fetch schemas over HTTP (reqwest + aws-lc). Validation is local.
jsonschema = { version = "0.61", default-features = false }
# Signs fixtures. The binary verifies with minisign-verify and does not link this.
minisign = "0.7"
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
