[package]
name = "gitcko-git"
version = "0.0.0"
description = "Read-only, command-free access to the repository under review: commits, merge bases, diffs, files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gitcko-diff = { path = "../gitcko-diff", version = "0.0.0" }
gitcko-domain = { path = "../gitcko-domain", version = "0.0.0" }
# No network transports and no worktree checkout: reading objects only (ADR-9).
gix = { workspace = true, features = ["revision", "blob-diff", "sha1"] }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe openat/O_NOFOLLOW for link-free worktree reads; std has no openat.
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
gitcko-test-support = { path = "../gitcko-test-support" }
serde_json.workspace = true

[lints]
workspace = true
