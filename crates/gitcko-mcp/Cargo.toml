[package]
name = "gitcko-mcp"
version = "0.0.0"
description = "Local MCP server: four review tools on stdio, no listener and no HTTP client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gitcko-config = { path = "../gitcko-config", version = "0.0.0" }
gitcko-domain = { path = "../gitcko-domain", version = "0.0.0" }
gitcko-git = { path = "../gitcko-git", version = "0.0.0" }
gitcko-model = { path = "../gitcko-model", version = "0.0.0" }
gitcko-model-ollama = { path = "../gitcko-model-ollama", version = "0.0.0" }
gitcko-model-openai = { path = "../gitcko-model-openai", version = "0.0.0" }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
gitcko-render = { path = "../gitcko-render", version = "0.0.0" }
gitcko-review = { path = "../gitcko-review", version = "0.0.0" }
gitcko-storage = { path = "../gitcko-storage", version = "0.0.0" }
# `server` + `transport-io` only. HTTP transports and rmcp's reqwest feature stay off.
# https://docs.rs/rmcp/3.10.0/rmcp/#feature-flags
rmcp = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
# The runtime this crate owns for `serve_stdio`. `io-std` is the stdio transport.
# https://docs.rs/tokio/1.54.1/tokio/#feature-flags
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util"] }
tokio-util.workspace = true

[dev-dependencies]
# The client speaks the same duplex the server does. No reqwest feature.
rmcp = { workspace = true, features = ["client"] }
gitcko-domain = { path = "../gitcko-domain", version = "0.0.0" }
gitcko-model = { path = "../gitcko-model", version = "0.0.0", features = ["fake"] }
gitcko-protocol = { path = "../gitcko-protocol", version = "0.0.0" }
gitcko-review = { path = "../gitcko-review", version = "0.0.0" }
gitcko-storage = { path = "../gitcko-storage", version = "0.0.0" }
gitcko-test-support = { path = "../gitcko-test-support", version = "0.0.0" }
futures-util = "0.3"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
tokio-util.workspace = true

[lints]
workspace = true
