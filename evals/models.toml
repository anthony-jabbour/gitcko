# The bindings `cargo xtask cassettes record` and `cargo xtask eval --live-model` run.
# Pinned model ids only: a cassette is keyed by the exact model, and a moving alias would
# make a recording mean nothing. `--model <binding>` serves `review` and `risk-classifier`;
# the judge keeps its own binding, from another family (MODEL_ROUTING §5).
#
# The key comes from OPENROUTER_API_KEY in your environment (or the git-ignored .env)
# and never goes in this file. Chosen 2026-11-02 for the Base tier as Cloud will run it:
# a Base review must cost about $0.08 in model spend to keep a 70% margin on a $0.40
# credit. Claude Haiku 5.5 reviews (the stronger cheap agentic coder); GPT-6 Luna judges
# from another family. Both are $0.10/$0.50 per 1M tokens, and prompts stay under the
# 100k-token price step. Each id names one dated release (claude-haiku-5.5-20261007,
# gpt-6-luna-20260922), not a moving alias. Plus and Max tiers bind Sonnet 5.5 and
# Opus 5.5 later; they get their own recordings.

[models.bindings.review]
provider = "openrouter"
model = "anthropic/claude-haiku-5.5"

[models.bindings.judge]
provider = "openrouter"
model = "openai/gpt-6-luna"

[models.roles]
review = "review"
risk-classifier = "review"
judge = "judge"
