[workspace]
resolver = "3"
# Crates are added under crates/ when their phase starts (see CONTRIBUTING.md); `cargo xtask layers`
# checks how they depend on each other. The glob means a new crate doesn't need an edit here.
members = ["xtask", "crates/*"]

[workspace.package]
edition = "2024"
# Latest stable minus two; the pinned toolchain is in rust-toolchain.toml.
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anthony-jabbour/gitcko"

[workspace.dependencies]
# Listed per phase at once (Phase 1, then Phase 2) so parallel crate PRs don't edit this file;
# an entry only reaches Cargo.lock once a crate uses it.
gitcko-protocol = { path = "crates/gitcko-protocol" }
criterion = "0.8"
gix = { version = "0.89", default-features = false }
gix-validate = "0.13"
ignore = "0.4"
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
regex = "1.13"
rustix = "1.1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
streaming-iterator = "0.1"
# Without its default features tantivy is pure Rust: the defaults add zstd, which compiles C,
# and stemming/stopwords, which don't suit code. mmap keeps the index off the heap.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3.27"
thiserror = "2"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
# Unicode identifier tables (XID), already in the build through proc-macro2.
unicode-ident = "1"
uuid = { version = "1.28", features = ["v7"] }

[workspace.lints.rust]
# A crate that truly needs unsafe code goes through an RFC (CONTRIBUTING.md).
unsafe_code = "forbid"
