# cargo-fuzz targets (TESTING §10). Outside the main workspace on purpose: it builds on
# its own pinned nightly (rust-toolchain.toml here) and never ships.
[package]
name = "gitcko-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
gitcko-config = { path = "../crates/gitcko-config" }
gitcko-diff = { path = "../crates/gitcko-diff" }
gitcko-domain = { path = "../crates/gitcko-domain" }
gitcko-model = { path = "../crates/gitcko-model" }
gitcko-model-ollama = { path = "../crates/gitcko-model-ollama" }
gitcko-model-openai = { path = "../crates/gitcko-model-openai" }
gitcko-prompts = { path = "../crates/gitcko-prompts" }
gitcko-syntax = { path = "../crates/gitcko-syntax" }
gitcko-tools = { path = "../crates/gitcko-tools" }

# Its own workspace, so the main one doesn't try to build it on stable.
[workspace]

[[bin]]
name = "diff_parse"
path = "fuzz_targets/diff_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_load"
path = "fuzz_targets/config_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax_extract"
path = "fuzz_targets/syntax_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_stream"
path = "fuzz_targets/provider_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_args"
path = "fuzz_targets/tool_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_output"
path = "fuzz_targets/model_output.rs"
test = false
doc = false
bench = false
